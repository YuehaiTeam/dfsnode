[package]
name = "dfsnode"
version = "0.1.0"
edition = "2024"

[dependencies]
# WebDAV
dav-server = { version = "0.10", features = ["localfs"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# HTTP server
axum = "0.8"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server-auto"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
bytes = "1"

# TLS / HTTPS
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"

# HTTP/3 (QUIC) + WebTransport
quinn = "0.11"
h3 = { git = "https://github.com/hyperium/h3", branch = "master" }
h3-quinn = { git = "https://github.com/hyperium/h3", branch = "master", features = ["datagram"] }
h3-webtransport = { git = "https://github.com/hyperium/h3", branch = "master" }
h3-datagram = { git = "https://github.com/hyperium/h3", branch = "master" }

# CLI
clap = { version = "4", features = ["derive"] }

# STUN NAT traversal
stun-types = "0.1"
time = "0.3"

# Checksums
sha1 = "0.10"
md5 = "0.7"

# Extended attributes (checksum cache)
fsquirrel = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Signature verification
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Auth
base64 = "0.22"

# Config file
serde_yaml = "0.9"

# UUID for TUS sessions
uuid = { version = "1", features = ["v4"] }

# HTTP client (webhook)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"

# Self-signed certificate generation
rcgen = { version = "0.13", features = ["ring"] }
arc-swap = "1"

# Error handling
anyhow = "1"
